<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genz D'Warrior - MG Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui;padding:16px;max-width:600px;margin:auto}h1{color:#a78bfa;margin:0}.sub{opacity:.6;font-size:12px;margin-bottom:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px;margin:12px 0}.btn{display:inline-block;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:8px 12px;margin:4px;font-size:13px}.btn.sel{background:#a78bfa33;border-color:#a78bfa;color:#a78bfa}input,textarea,select{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:12px;padding:12px;margin-top:6px}.primary{width:100%;background:#a78bfa;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:800;font-size:16px;margin-top:10px}.log{background:#0f172a;border:1px dashed #334155;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}</style></head><body><h1>⚔️ GENZ D'WARRIOR</h1><div class="sub">Myasthenia Gravis Tracker • Offline</div><div class="card"><b>Today's Battle</b><br><br><div id="syms"></div><div style="margin-top:12px">Fatigue <span id="fv" style="color:#a78bfa;font-weight:700">5/10</span><input type="range" id="fat" min="0" max="10" value="5" oninput="fv.textContent=this.value+'/10'" style="width:100%;accent-color:#a78bfa"></div><select id="meds" style="margin-top:10px"><option>✅ All meds taken</option><option>⚠️ Missed one</option><option>❌ Missed</option></select></div><div class="card"><b>Warrior Diary</b><textarea id="diary" placeholder="Kamusta ka today warrior?"></textarea><button class="primary" onclick="let l={d:new Date().toLocaleString(),f:fat.value,m:meds.value,t:diary.value,s:[...sel]};let a=JSON.parse(localStorage.getItem('gdw2')||'[]');a.unshift(l);localStorage.setItem('gdw2',JSON.stringify(a));alert('Saved Warrior! ⚔️');location.reload()">⚔️ SAVE TODAY</button></div><div class="card"><b>History</b><div id="hist" style="margin-top:8px"></div></div><script>let s=['👁️ Eyes','🗣️ Speech','🥤 Swallow','💪 Limbs','🌬️ Breath','😴 Sleepy'];let sel=new Set();syms.innerHTML=s.map((x,i)=>`<span class=btn id=b${i} onclick="this.classList.toggle('sel');sel.has(${i})?sel.delete(${i}):sel.add(${i})">${x}</span>`).join('');let logs=JSON.parse(localStorage.getItem('gdw2')||'[]');hist.innerHTML=logs.map(l=>`<div class=log><b>${l.d}</b> • Fatigue ${l.f}<br>${l.s.map(i=>s[i]).join(', ')}<br>${l.t}</div>`).join('')||'No logs yet';</script></body></html>
